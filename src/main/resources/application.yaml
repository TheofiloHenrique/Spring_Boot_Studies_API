spring:
  application:
    name: rest-with-spring-and-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rest_with_spring_boot_theo?useTimezone=true&serverTimezone=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    br.com.theo: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

